<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>우리 결혼 준비 — 청실홍실</title>
<style>
  /* 입력 시 자동 확대 방지 · 좌우 폭 고정 */
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; }
  html,body{ max-width:100%; overflow-x:hidden; overflow-x:clip; }

  @import url('https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/variable/pretendardvariable.min.css');
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');

  :root{
    --paper:#FAF9F6; --card:#FFFFFF; --ink:#26262E; --sub:#75716A; --faint:#A6A29A;
    --line:#E8E4DC; --blue:#27427A; --blue-soft:#E9EEF7; --red:#B5424E; --red-soft:#F8ECEB;
    --gold:#8A6D3B; --danger:#A33030;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
    font-size:14px; line-height:1.5; overflow-x:hidden; overflow-x:clip;
  }
  .wrap{ max-width:720px; margin:0 auto; padding:0 16px 96px; }
  button{ font-family:inherit; cursor:pointer; }
  input, textarea{ font-family:inherit; font-size:14px; padding:10px 12px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink); width:100%; outline:none; }
  input:focus, textarea:focus{ border-color:var(--blue); }
  ::placeholder{ color:var(--faint); }
  button:focus-visible, input:focus-visible, textarea:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  a{ color:var(--blue); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  /* 헤더 */
  header{ padding:28px 4px 18px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .eyebrow{ font-size:12px; letter-spacing:.18em; color:var(--gold); font-weight:700; }
  h1{ margin:4px 0 0; font-family:'Gowun Batang', serif; font-size:26px; font-weight:700; letter-spacing:-.01em; }
  .dday{ text-align:right; }
  .dday b{ font-family:'Gowun Batang', serif; font-size:24px; font-weight:700; color:var(--red); display:block; }
  .dday span{ font-size:11px; color:var(--faint); }

  /* 탭 바 */
  nav.tabbar{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 14px; position:sticky; top:0;
    background:var(--paper); z-index:5; scrollbar-width:none; }
  nav.tabbar::-webkit-scrollbar{ display:none; }
  .tab{ flex-shrink:0; font-size:13px; font-weight:500; padding:8px 14px; border-radius:999px;
    border:1px solid var(--line); background:#fff; color:var(--ink); display:flex; align-items:center; gap:6px; transition:all .15s; }
  .tab.active{ background:var(--ink); color:#fff; border-color:var(--ink); font-weight:700; }
  .tab.muted{ color:var(--faint); }
  .tab .dot{ width:6px; height:6px; border-radius:99px; }
  .tab.active .dot{ background:#fff !important; }

  /* 카드 공통 */
  .grid{ display:grid; gap:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; }
  .row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .label{ font-size:12px; color:var(--sub); font-weight:600; }

  /* 써머리 */
  .total{ font-family:'Gowun Batang', serif; font-size:28px; font-weight:700; color:var(--blue); }
  .pend{ font-size:15px; font-weight:600; color:var(--red); }
  .grand{ font-size:15px; font-weight:700; }
  .divider{ border-top:1px dashed var(--line); margin-top:12px; padding-top:12px; }
  .thread-meta{ display:flex; justify-content:space-between; font-size:11px; color:var(--faint); margin-top:4px; }
  h2.sec{ margin:6px 4px 2px; font-size:13px; font-weight:700; color:var(--sub); letter-spacing:.04em; }
  .catrow{ width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:13px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .catrow .name{ font-size:14px; font-weight:700; }
  .catrow .desc{ font-size:12px; color:var(--sub); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60vw; }
  .catrow .amt{ font-weight:700; color:var(--blue); font-size:14px; white-space:nowrap; }
  .catrow .warn{ font-size:11px; color:var(--danger); margin-top:2px; }

  /* 배지·칩 */
  .badge{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap; border:1px solid var(--line); }
  .chip{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; border:1px solid var(--line);
    background:#fff; color:var(--faint); transition:all .15s; }
  .st-candidate{ background:#F1EFEA; color:var(--sub); border-color:var(--line); }
  .st-considering{ background:var(--red-soft); color:var(--red); border-color:#E7C9CC; }
  .st-decided{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .st-dropped{ background:#F5F4F1; color:var(--faint); border-color:var(--line); }

  /* 옵션 카드 */
  .opt{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px 16px; cursor:pointer; min-width:0; }
  .opt.decided{ border-color:var(--blue); box-shadow:0 2px 12px rgba(39,66,122,.09); }
  .opt.dropped{ opacity:.55; }
  .opt .nm{ font-size:15px; font-weight:700; overflow-wrap:anywhere; }
  .opt.dropped .nm{ text-decoration:line-through; }
  .opt .pr{ font-size:15px; font-weight:600; margin-top:2px; }
  .opt.decided .pr{ color:var(--blue); }
  .opt .memo{ margin:10px 0 0; font-size:13px; color:var(--sub); line-height:1.55; white-space:pre-wrap;
    overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .opt .actions{ display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; align-items:center; }
  .opt .actions .spacer{ margin-left:auto; display:flex; gap:4px; }
  .txtbtn{ font-size:12px; color:var(--sub); background:none; border:none; padding:4px 6px; }
  .txtbtn.faint{ color:var(--faint); }
  .opt a{ overflow-wrap:anywhere; }
  .catrow .desc{ overflow-wrap:anywhere; }

  /* 옵션 상세 보기 */
  #detail{ position:fixed; inset:0; background:var(--paper); z-index:90; display:none; overflow-y:auto;
    -webkit-overflow-scrolling:touch; }
  #detail .inner{ max-width:720px; margin:0 auto; padding:0 16px 80px; }
  .dt-top{ display:flex; justify-content:space-between; align-items:center; padding:14px 0 10px;
    position:sticky; top:0; background:var(--paper); z-index:2; }
  .dt-back{ font-size:14px; font-weight:600; background:none; border:none; color:var(--sub); padding:6px 8px 6px 0; }
  .dt-name{ font-family:'Gowun Batang', serif; font-size:24px; font-weight:700; margin:6px 0 4px; overflow-wrap:anywhere; }
  .dt-cat{ font-size:12px; color:var(--gold); font-weight:700; letter-spacing:.06em; }
  .dt-price{ font-size:20px; font-weight:700; color:var(--blue); }
  .dt-chips{ display:flex; gap:6px; margin-top:14px; flex-wrap:wrap; }
  .dt-memo{ font-size:15px; line-height:1.75; color:var(--ink); white-space:pre-wrap; overflow-wrap:anywhere;
    margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
  .dt-photos{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:18px; }
  .dt-photos img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px;
    border:1px solid var(--line); cursor:pointer; background:#F1EFEA; }
  .dt-actions{ display:flex; gap:8px; margin-top:24px; flex-wrap:wrap; }

  /* 폼 */
  .form{ background:var(--blue-soft); border:1px solid rgba(39,66,122,.14); border-radius:16px; padding:18px; display:grid; gap:10px; }
  .form .title{ font-size:13px; font-weight:700; color:var(--blue); }
  .form .btns{ display:flex; gap:8px; justify-content:flex-end; }
  .btn-ghost{ font-size:13px; padding:9px 16px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--sub); }
  .btn-primary{ font-size:13px; font-weight:700; padding:9px 18px; border-radius:10px; border:none; background:var(--blue); color:#fff; }

  /* 축의금 */
  .gf-split{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .gf-sp{ border-radius:12px; padding:10px 12px; }
  .gf-sp.g{ background:var(--blue-soft); } .gf-sp.r{ background:var(--red-soft); }
  .gf-sp .l{ font-size:11px; font-weight:700; } .gf-sp.g .l{ color:var(--blue); } .gf-sp.r .l{ color:var(--red); }
  .gf-sp .n{ font-size:17px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums; }
  .gf-sp .m{ font-size:11.5px; color:var(--sub); margin-top:1px; }
  .gf-form{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; }
  .gf-form > *{ min-width:0; }
  .gf-form input[type=date]{ display:block; width:100%; min-width:0; max-width:100%; box-sizing:border-box;
    -webkit-appearance:none; appearance:none; -webkit-min-logical-width:0; min-height:42px; line-height:1.3; text-align:left; }
  .gf-form input[type=date]::-webkit-date-and-time-value{ text-align:left; }
  .gf-form .w{ grid-column:1/-1; }
  .gf-form select{ font-family:inherit; font-size:14px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); width:100%; }
  .gf-seg{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .gf-seg button{ flex:1; font-size:13px; padding:9px 0; color:var(--sub); background:#fff; border:0; font-weight:600; }
  .gf-seg button.on{ background:var(--ink); color:#fff; font-weight:700; }
  .gf-btns{ grid-column:1/-1; display:flex; gap:8px; }
  .gf-btns .btn-primary{ flex:1; padding:12px; font-size:14px; }
  .gf-tools{ display:flex; flex-direction:column; gap:8px; }
  .gf-flt{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .gf-flt::-webkit-scrollbar{ display:none; }
  .gf-flt button{ flex-shrink:0; font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--sub); font-weight:600; }
  .gf-flt button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .gf-row{ display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:13px; }
  .gf-row.editing{ border-color:var(--blue); }
  .gf-side{ width:6px; height:30px; border-radius:3px; flex-shrink:0; }
  .gf-side.g{ background:var(--blue); } .gf-side.r{ background:var(--red); }
  .gf-nm{ flex:1; min-width:0; cursor:pointer; }
  .gf-nm b{ display:block; font-size:14px; }
  .gf-nm small{ color:var(--sub); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .gf-amt{ font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .gf-thx{ width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; font-size:11px; color:var(--faint); background:#fff; flex-shrink:0; padding:0; }
  .gf-thx.on{ background:#4a7c59; border-color:#4a7c59; color:#fff; }
  .gf-foot{ display:flex; gap:8px; }
  .gf-foot button{ flex:1; font-size:12.5px; padding:9px 6px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--sub); font-weight:600; }
  .gf-foot button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .gf-tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .gf-tbl td{ padding:7px 4px; border-top:1px dashed var(--line); }
  .gf-tbl td:last-child{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .gf-tbl tr:first-child td{ border-top:0; }
  .gf-empty{ text-align:center; color:var(--faint); font-size:13px; padding:22px 0; }
  .add-opt{ font-size:14px; font-weight:600; padding:13px; border-radius:14px; border:1.5px dashed rgba(39,66,122,.4);
    background:#fff; color:var(--blue); width:100%; }
  .empty{ text-align:center; padding:36px 0; color:var(--faint); font-size:13px; }

  /* 일정 */
  .sched-toggle{ display:flex; gap:6px; }
  .sched-toggle button{ flex:1; font-size:13px; font-weight:600; padding:9px; border-radius:10px;
    border:1px solid var(--line); background:#fff; color:var(--sub); }
  .sched-toggle button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-title{ font-family:'Gowun Batang', serif; font-size:17px; font-weight:700; }
  .cal-nav{ background:none; border:none; font-size:16px; color:var(--sub); padding:6px 12px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; }
  .cal-dow{ text-align:center; font-size:11px; color:var(--faint); padding:4px 0 6px; font-weight:600; }
  .cal-cell{ aspect-ratio:1/1; border:none; background:none; border-radius:10px; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:13px; color:var(--ink); }
  .cal-cell.dim{ opacity:.35; }
  .cal-cell.today{ font-weight:800; color:var(--blue); }
  .cal-cell.sel{ background:var(--blue-soft); }
  .cal-cell.wed{ box-shadow:inset 0 0 0 1.5px var(--red); }
  .cal-cell.sun{ color:var(--red); }
  .cal-dots{ display:flex; gap:2px; height:4px; }
  .cal-dots i{ width:4px; height:4px; border-radius:99px; background:var(--blue); }
  .tl-date{ font-size:12px; font-weight:700; color:var(--sub); margin:16px 4px 6px;
    display:flex; justify-content:space-between; align-items:baseline; }
  .tl-dd{ color:var(--red); font-weight:700; }
  .ev{ display:flex; gap:10px; align-items:flex-start; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .ev.done{ opacity:.5; }
  .ev.wedday{ border-color:var(--red); background:var(--red-soft); }
  .ev .body{ min-width:0; flex:1; cursor:pointer; }
  .ev .t{ font-size:12px; color:var(--sub); font-weight:600; }
  .ev .tt{ font-size:14px; font-weight:700; overflow-wrap:anywhere; }
  .ev.done .tt{ text-decoration:line-through; }
  .ev .mm{ font-size:12px; color:var(--sub); margin-top:2px; overflow-wrap:anywhere; white-space:pre-wrap; }
  .ev-check{ width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line); background:#fff;
    flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff; padding:0; }
  .ev-check.on{ background:var(--blue); border-color:var(--blue); }
  .taglink{ background:none; border:none; padding:0; font:inherit; font-weight:700;
    color:var(--blue); text-decoration:underline; cursor:pointer; overflow-wrap:anywhere; }
  .tagrow{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; align-items:center; }
  .tagrow::-webkit-scrollbar{ display:none; }
  .tagrow .chip{ flex-shrink:0; }

  /* 순서 변경 */
  #reorder{ position:fixed; inset:0; background:var(--paper); z-index:95; display:none; overflow-y:auto;
    -webkit-overflow-scrolling:touch; }
  #reorder .inner{ max-width:720px; margin:0 auto; padding:0 16px 60px; }
  .ro-row{ display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; margin-bottom:8px; user-select:none; -webkit-user-select:none; }
  .ro-row.dragging{ opacity:.9; box-shadow:0 8px 20px rgba(0,0,0,.14); position:relative; z-index:2;
    border-color:var(--blue); }
  .ro-handle{ font-size:17px; color:var(--faint); touch-action:none; cursor:grab; padding:6px 10px; margin-left:-6px; }
  .ro-name{ font-size:14px; font-weight:700; flex:1; overflow-wrap:anywhere; }
  .ro-btn{ background:#fff; border:1px solid var(--line); border-radius:8px; font-size:14px;
    color:var(--sub); padding:6px 12px; }

  /* 사진 */
  .thumbs{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .thumb{ width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--line);
    cursor:pointer; background:#F1EFEA; }
  #lightbox{ position:fixed; inset:0; background:rgba(20,20,24,.93); z-index:200; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:20px; }
  #lightbox img{ max-width:100%; max-height:78vh; border-radius:10px; }
  #lb-del{ font-size:13px; padding:8px 16px; border-radius:999px; border:1px solid rgba(255,255,255,.4);
    background:none; color:#fff; }

  /* 핀번호 게이트 */
  #gate{ position:fixed; inset:0; background:var(--paper); z-index:100; display:none;
    align-items:center; justify-content:center; padding:24px; }
  .gate-card{ width:100%; max-width:320px; text-align:center; }
  .gate-card .eyebrow{ margin-bottom:2px; }
  .gate-card h2{ margin:4px 0 20px; font-family:'Gowun Batang', serif; font-size:22px; font-weight:700; }
  #pin-input{ text-align:center; font-size:22px; letter-spacing:.5em; padding:12px; }
  #pin-btn{ width:100%; margin-top:10px; font-size:14px; font-weight:700; padding:12px;
    border-radius:12px; border:none; background:var(--blue); color:#fff; }
  #pin-err{ font-size:12px; color:var(--danger); margin-top:10px; min-height:16px; }

  /* 토스트 */
  #toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:999px; font-size:13px; z-index:50; display:none; }
</style>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

<style id="mode-switch-css">
  #modeSwitch{ display:flex; gap:4px; align-items:center; justify-content:center; width:-moz-fit-content; width:fit-content;
    margin:16px auto 8px; background:#fff; border:1px solid #E8E4DC; border-radius:999px; padding:5px; box-shadow:0 2px 10px rgba(40,30,20,.06); }
  #modeSwitch button{ border:0; background:transparent; font-family:inherit; font-size:13px; font-weight:700;
    color:#75716A; padding:8px 18px; border-radius:999px; cursor:pointer; transition:.18s; white-space:nowrap; }
  #modeSwitch button.on{ background:#26262E; color:#fff; }
  #modeSwitch .rl{ padding:8px 12px; font-size:15px; color:#8a8177; border-left:1px solid #E8E4DC; border-radius:0; }
  #modeSwitch .rl:hover{ color:#26262E; }
</style>
</head>
<body>

<div id="modeSwitch">
  <button id="mm-wed" class="on" onclick="__setMode('wed')">💍 결혼준비</button>
  <button id="mm-hm" onclick="__setMode('hm')">✈️ 신혼여행</button>
  <button class="rl" title="최신버전으로 새로고침" onclick="__hardReload()">↻</button>
</div>

<div id="modeWedding">
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">청실홍실</div>
      <h1>우리 결혼 준비</h1>
    </div>
    <div class="dday" id="dday"></div>
  </header>
  <nav class="tabbar" id="tabbar"></nav>
  <main id="main"></main>
</div>
<div id="gate">
  <div class="gate-card">
    <div class="eyebrow">청실홍실</div>
    <h2>우리 결혼 준비</h2>
    <input id="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="····"
      autocomplete="off" oninput="if(this.value.length===4)App.tryPin()"
      onkeydown="if(event.key==='Enter')App.tryPin()" />
    <button id="pin-btn" onclick="App.tryPin()">열기</button>
    <div id="pin-err"></div>
  </div>
</div>
<div id="reorder"><div class="inner" id="reorder-inner"></div></div>
<div id="detail"><div class="inner" id="detail-inner"></div></div>
<div id="lightbox" onclick="if(event.target.id==='lightbox')App.closePhoto()">
  <img id="lb-img" alt="" />
  <button id="lb-del" onclick="App.deletePhoto()">사진 삭제</button>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
"use strict";

async function sha256hex(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,"0")).join("");
}

async function photoGet(id){
  if (photoCache[id]) return photoCache[id];
  if (fbPhotos){
    try { const s = await fbPhotos.child(id).get(); const v = s.exists() ? s.val() : null;
      if (v) photoCache[id] = v; return v; } catch(e){ return null; }
  }
  return (state.photos || {})[id] || null;
}
async function photoSet(id, data){
  photoCache[id] = data;
  if (fbPhotos){ try { await fbPhotos.child(id).set(data); return true; } catch(e){ return false; } }
  state.photos = state.photos || {}; state.photos[id] = data; return true;
}
async function photoDel(id){
  delete photoCache[id];
  if (fbPhotos){ try { await fbPhotos.child(id).remove(); } catch(e){} }
  if (state.photos) delete state.photos[id];
}
function resizeImage(file, maxDim, quality){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const m = Math.max(w, h);
        if (m > maxDim){ const k = maxDim / m; w = Math.round(w*k); h = Math.round(h*k); }
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        res(cv.toDataURL("image/jpeg", quality));
      };
      img.onerror = rej;
      img.src = r.result;
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function hydratePhotos(){
  const imgs = document.querySelectorAll("img[data-pid]");
  for (const el of imgs){
    const src = await photoGet(el.getAttribute("data-pid"));
    if (src) el.src = src;
  }
}

const fmtWon = (n) => {
  if (n == null || isNaN(n)) return "—";
  if (n >= 100000000){
    const eok = Math.floor(n/100000000), man = Math.round((n%100000000)/10000);
    return man > 0 ? eok + "억 " + man.toLocaleString() + "만원" : eok + "억원";
  }
  if (n >= 10000 && n % 10000 === 0) return (n/10000).toLocaleString() + "만원";
  if (n >= 10000) return (n/10000).toLocaleString(undefined,{maximumFractionDigits:1}) + "만원";
  return n.toLocaleString() + "원";
};

/* ── 저장 어댑터 (Firebase → 아티팩트 → localStorage 순) ── */
const store = {
  async get(k){
    if (fbRef){
      try { const snap = await fbRef.get(); return snap.exists() ? snap.val() : null; } catch(e){ console.error(e); return null; }
    }
    if (typeof window.storage !== "undefined" && window.storage?.get){
      try { const r = await window.storage.get(k); return r?.value ?? null; } catch(e){ return null; }
    }
    try { return localStorage.getItem(k); } catch(e){ return null; }
  },
  async set(k,v){
    if (fbRef){
      try { lastWritten = v; await fbRef.set(v); return true; } catch(e){ console.error(e); return false; }
    }
    if (typeof window.storage !== "undefined" && window.storage?.set){
      try { await window.storage.set(k,v); return true; } catch(e){ /* fallthrough */ }
    }
    try { localStorage.setItem(k,v); return true; } catch(e){ return false; }
  }
};

/* ── 계산 ── */
function calc(){
  const rows = state.categories.map(c=>{
    const decided = c.options.filter(o=>o.status==="decided");
    const pending = c.options.filter(o=>o.status==="candidate"||o.status==="considering");
    const decidedSum = decided.reduce((s,o)=>s+(o.price||0),0);
    const prices = pending.map(o=>o.price).filter(p=>p!=null);
    return { cat:c, decided, pending, decidedSum,
      min: prices.length?Math.min(...prices):null,
      max: prices.length?Math.max(...prices):null,
      over: c.budgetCap!=null && decidedSum>c.budgetCap };
  });
  const confirmed = rows.reduce((s,r)=>s+r.decidedSum,0);
  const open = rows.filter(r=>r.decided.length===0 && r.pending.length>0);
  return {
    rows, confirmed,
    pendMin: open.reduce((s,r)=>s+(r.min||0),0),
    pendMax: open.reduce((s,r)=>s+(r.max||0),0),
    activeCats: rows.filter(r=>r.decided.length>0||r.pending.length>0),
    doneCats: rows.filter(r=>r.decided.length>0),
  };
}

}

function renderWithTags(text){
  const idx = optionIndex();
  let out = "", i = 0;
  while (i < text.length){
    if (text[i] === "#"){
      const rest = text.slice(i+1);
      let hit = null;
      for (const it of idx){ if (rest.startsWith(it.name)){ hit = it; break; } }
      if (hit){
        out += '<button class="taglink" onclick="event.stopPropagation();App.openDetail(\''+hit.catId+'\',\''+hit.optId+'\')">#'+esc(hit.name)+'</button>';
        i += 1 + hit.name.length;
        continue;
      }
    }
    out += esc(text[i]);
    i++;
  }
  return out;
}

/* ── 일정 ── */
let schedView = "calendar";   // 'calendar' | 'timeline'
let calCursor = null;         // {y, m}
let selDate = null;           // 'YYYY-MM-DD'
let evFormState = null;       // {editingId, date}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
const DOW = ["일","월","화","수","목","금","토"];
function fmtDateK(ds){
  const d = new Date(ds+"T00:00:00");
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DOW[d.getDay()]+")";
}
function ddayOf(ds){
  return Math.ceil((new Date(ds+"T00:00:00") - new Date().setHours(0,0,0,0)) / 86400000);
}
function ddayLabel(ds){
  const n = ddayOf(ds);
  return n > 0 ? "D-"+n : n === 0 ? "오늘" : "D+"+(-n);
}
function allEvents(){
  const evs = (state.events || []).slice();
  if (state.weddingDate) evs.push({ id:"__wed", date: state.weddingDate, time:"", title:"💒 예식일", memo:"", fixed:true });
  return evs.sort((a,b)=> a.date===b.date ? (a.time||"99:99").localeCompare(b.time||"99:99") : a.date.localeCompare(b.date));
}

function calendarHTML(){
  const y = calCursor.y, m = calCursor.m;
  const startDow = new Date(y, m, 1).getDay();
  const daysIn = new Date(y, m+1, 0).getDate();
  const today = todayStr();
  const byDate = {};
  for (const e of allEvents()){ (byDate[e.date] = byDate[e.date] || []).push(e); }

  let html = '<section class="card" style="padding:16px">'
    + '<div class="cal-head">'
    + '<button class="cal-nav" onclick="App.calMove(-1)">◀</button>'
    + '<div class="cal-title">'+y+'년 '+(m+1)+'월</div>'
    + '<button class="cal-nav" onclick="App.calMove(1)">▶</button>'
    + '</div><div class="cal-grid">';
  for (let i=0;i<7;i++) html += '<div class="cal-dow"'+(i===0?' style="color:var(--red)"':'')+'>'+DOW[i]+'</div>';
  for (let i=0;i<startDow;i++) html += '<div></div>';
  for (let d=1; d<=daysIn; d++){
    const ds = y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const dow = (startDow + d - 1) % 7;
    const list = byDate[ds] || [];
    let cls = "cal-cell";
    if (dow===0) cls += " sun";
    if (ds===today) cls += " today";
    if (ds===selDate) cls += " sel";
    if (ds===state.weddingDate) cls += " wed";
    let dots = '<span class="cal-dots">';
    for (let i=0;i<Math.min(list.length,3);i++) dots += '<i'+(list[i].fixed?' style="background:var(--red)"':'')+'></i>';
    dots += '</span>';
    html += '<button class="'+cls+'" onclick="App.calSelect(\''+ds+'\')">'+d+dots+'</button>';
  }
  html += '</div></section>';

  const list = byDate[selDate] || [];
  html += '<div><div class="tl-date"><span>'+fmtDateK(selDate)+'</span><span class="tl-dd">'+ddayLabel(selDate)+'</span></div>';
  if (!list.length) html += '<div class="empty" style="padding:14px 0">이 날은 일정이 없어요</div>';
  for (const e of list) html += evRowHTML(e);
  html += '</div>';
  return html;
}

function timelineHTML(){
  const today = todayStr();
  const evs = allEvents();
  if (!evs.length) return '<div class="empty">등록된 일정이 없어요. 위 버튼으로 추가해 보세요.</div>';
  const upcoming = evs.filter(e=>e.date >= today);
  const past = evs.filter(e=>e.date < today).reverse();
  let html = '<div>';
  let lastDate = null;
  for (const e of upcoming){
    if (e.date !== lastDate){
      html += '<div class="tl-date"><span>'+fmtDateK(e.date)+'</span><span class="tl-dd">'+ddayLabel(e.date)+'</span></div>';
      lastDate = e.date;
    }
    html += evRowHTML(e);
  }
  if (!upcoming.length) html += '<div class="empty" style="padding:14px 0">다가오는 일정이 없어요</div>';
  if (past.length){
    html += '<h2 class="sec" style="margin-top:24px">지난 일정</h2>';
    lastDate = null;
    for (const e of past){
      if (e.date !== lastDate){
        html += '<div class="tl-date" style="opacity:.7"><span>'+fmtDateK(e.date)+'</span><span style="color:var(--faint)">'+ddayLabel(e.date)+'</span></div>';
        lastDate = e.date;
      }
      html += evRowHTML(e, true);
    }
  }
  html += '</div>';
  return html;
}

function evRowHTML(e, pastSection){
  if (e.fixed){
    return '<div class="ev wedday"><div class="body" style="cursor:default">'
      + '<div class="tt" style="color:var(--red)">'+esc(e.title)+'</div></div></div>';
  }
  return '<div class="ev'+(e.done?' done':'')+'"'+(pastSection?' style="opacity:.6"':'')+'>'
    + '<button class="ev-check'+(e.done?' on':'')+'" onclick="App.evToggle(\''+e.id+'\')">'+(e.done?'✓':'')+'</button>'
    + '<div class="body" onclick="if(!event.target.closest(\'.taglink\'))App.evOpenForm(null,\''+e.id+'\')">'
    + (e.time ? '<div class="t">'+esc(e.time)+'</div>' : '')
    + '<div class="tt">'+renderWithTags(e.title)+'</div>'
    + (e.memo ? '<div class="mm">'+renderWithTags(e.memo)+'</div>' : '')
    + '</div></div>';
}

/* ── 액션 ── */
window.App = {
  commas: withCommas,
  setTab(id){ tab = id; formState = null; evFormState = null; render(); window.scrollTo({top:0}); },
  schedMode(m){ schedView = m; render(); },
  calMove(dir){
    let m = calCursor.m + dir, y = calCursor.y;
    if (m < 0){ m = 11; y--; } if (m > 11){ m = 0; y++; }
    calCursor = { y, m }; render();
  },
  calSelect(ds){ selDate = ds; render(); },
  _evTarget: "title",
  evInsertTag(i){
    const name = evTagList[i];
    if (!name) return;
    const el = document.getElementById(this._evTarget === "memo" ? "ev-memo" : "ev-title");
    if (!el) return;
    let v = el.value.replace(/#\s*$/, "");           // 방금 친 # 는 정리
    if (v && !/\s$/.test(v)) v += " ";
    el.value = v + "#" + name + " ";
    el.focus();
  },
  evOpenForm(date, id){
    evFormState = { editingId: id || null, date: date || selDate || todayStr() };
    render();
    setTimeout(()=>document.getElementById("ev-title")?.focus(), 0);
  },
  evCancel(){ evFormState = null; if (pendingRemote){ state = pendingRemote; pendingRemote = null; } render(); },
  evSave(){
    const title = document.getElementById("ev-title").value.trim();
    const date = document.getElementById("ev-date").value;
    if (!title || !date){ document.getElementById("ev-title").focus(); return; }
    const time = document.getElementById("ev-time").value || "";
    const memo = document.getElementById("ev-memo").value.trim();
    state.events = state.events || [];
    if (evFormState.editingId){
      const e = state.events.find(x=>x.id===evFormState.editingId);
      if (e) Object.assign(e, { title, date, time, memo });
    } else {
      state.events.push({ id: uid(), title, date, time, memo, done:false });
    }
    selDate = date;
    calCursor = { y: parseInt(date.slice(0,4),10), m: parseInt(date.slice(5,7),10)-1 };
    evFormState = null; pendingRemote = null; persist(); render();
  },
  /* 순서 변경 */
  reorderOpen(){ reorderMode = true; renderReorder(); },
  reorderDone(){ reorderMode = false; renderReorder(); render(); },
  roMove(id, dir){
    const i = state.categories.findIndex(c=>c.id===id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= state.categories.length) return;
    const [c] = state.categories.splice(i, 1);
    state.categories.splice(j, 0, c);
    persist(); renderReorder();
  },
  roDown(e, id){
    e.preventDefault();
    const row = e.currentTarget.closest(".ro-row");
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch(err){}

/* ── 초기화 ── */
async function startApp(){
  try {
    const raw = await store.get(KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.categories)){
        parsed.events = Array.isArray(parsed.events) ? parsed.events : [];
        parsed.gifts = Array.isArray(parsed.gifts) ? parsed.gifts : [];
        // 마이그레이션: 가전 항목 보장
        if (!parsed.categories.some(c=>c.name==="가전")){
          const idx = parsed.categories.findIndex(c=>c.name==="집 인테리어");
          parsed.categories.splice(idx>=0?idx+1:parsed.categories.length, 0, { id: uid(), name:"가전", budgetCap:null, options:[] });
        }
        state = parsed;
      }
    }
  } catch(e){ /* 첫 실행 */ }
  render();

  /* 실시간 동기화: 상대방이 수정하면 내 화면도 즉시 갱신 */
  if (fbRef){
    fbRef.on("value", (snap)=>{
      const raw = snap.val();
      if (!raw || raw === lastWritten) return;
      try {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.categories)){
          parsed.events = Array.isArray(parsed.events) ? parsed.events : [];
          parsed.gifts = Array.isArray(parsed.gifts) ? parsed.gifts : [];
          if (formState || evFormState || (tab==="gift" && document.activeElement && /^gf-/.test(document.activeElement.id||""))){ pendingRemote = parsed; }   // 입력 중이면 폼 닫힌 뒤 반영
          else { state = parsed; render(); }
        }
      } catch(e){}
    });
    toast("공유 저장소에 연결됐어요");
  }
}

/* ── 핀번호 게이트 ── */
function connectRoom(room){
  if (FB_ENABLED && typeof firebase !== "undefined"){
    try {
      fbRef = firebase.database().ref("planners/" + room);
      fbPhotos = firebase.database().ref("photos/" + room);
    } catch(e){ console.error(e); }
  }
  document.getElementById("gate").style.display = "none";
  startApp();
}

App.tryPin = async function(){
  const input = document.getElementById("pin-input");
  const err = document.getElementById("pin-err");
  const pin = input.value.trim();
  if (pin.length < 4) return;
  try {
    const v = await sha256hex(PIN_SALT_VERIFY + pin);
    if (v !== PIN_VERIFY_HASH){
      err.textContent = "핀번호가 맞지 않아요";
      input.value = ""; input.focus();
      return;
    }
    const room = "wp-" + (await sha256hex(PIN_SALT_ROOM + pin)).slice(0, 40);
    try { localStorage.setItem("wp-room", room); } catch(e){}
    connectRoom(room);
  } catch(e){
    err.textContent = "이 환경에서는 잠금 해제를 지원하지 않아요";
  }
};

(function boot(){
  let saved = null;
  try { saved = localStorage.getItem("wp-room"); } catch(e){}
  if (saved){
    connectRoom(saved);   // 이 기기에서 이미 인증됨 → 바로 열기
  } else {
    document.getElementById("gate").style.display = "flex";
    setTimeout(()=>document.getElementById("pin-input")?.focus(), 100);
  }
})();
</script>

yP=(la,lo)=>[P.ox+(lo*P.k-P.xmin)*P.s, P.oy+(-la-P.ymin)*P.s];\n  const gPins=svg.querySelector('.gPins');\n  let view=null,target={x:0,y:0,w:100,h:100},pins=[],u=1;\n  const box=()=>svg.getBoundingClientRect();\n  function aspect(){const r=box();return r.height?r.width/r.height:.9;}\n  function rect(la,lo,span){\n    const c=xyP(la,lo), h=Math.max(span*P.s,40), w=h*aspect();\n    const bias=biasK(.085,.045)*h;          // 하단 정보줄을 피해 내용물을 위로\n    return {x:c[0]-w/2,y:c[1]-h/2+bias,w,h};\n  }\n  function focus(la,lo,span,jump){\n    target=rect(la,lo,span);\n    if(!view||jump)view={...target};\n  }\n  function fitPts(list,minSpan,pad){\n    if(!list||!list.length)return;\n    let a=90,b2=-90,c=180,d2=-180;\n    list.forEach(p=>{a=Math.min(a,p[0]);b2=Math.max(b2,p[0]);c=Math.min(c,p[1]);d2=Math.max(d2,p[1]);});\n    const ms=minSpan||0;\n    if(b2-a<ms){const m=(a+b2)/2;a=m-ms/2;b2=m+ms/2;}\n    fit([a,b2,c,d2],pad||(narrow()?1.58:1.34));\n  }\n  function presetScale(f){ if(!view)view={...target};\n    const cx=target.x+target.w/2, cy=target.y+target.h/2;\n    view={x:cx-target.w*f/2,y:cy-target.h*f/2,w:target.w*f,h:target.h*f}; }\n  function zoomOut(f){ const cx=target.x+target.w/2, cy=target.y+target.h/2;\n    target={x:cx-target.w*f/2,y:cy-target.h*f/2,w:target.w*f,h:target.h*f}; }\n  function fit(b,pad){\n    const p=pad||1.18;\n    const a=xyP(b[1],b[2]),c=xyP(b[0],b[3]);          // [latMin,latMax,lonMin,lonMax]\n    const cx=(a[0]+c[0])/2, cy=(a[1]+c[1])/2;\n    let w=Math.abs(c[0]-a[0])*p, h=Math.abs(c[1]-a[1])*p, ar=aspect();\n    if(w/h<ar) w=h*ar; else h=w/ar;\n    target={x:cx-w/2,y:cy-h/2+biasK(.075,.03)*h,w,h};\n    if(!view)view={...target};\n  }\n  function preset(la,lo,span){ view=rect(la,lo,span); }\n  function setPins(list){\n    gPins.textContent=''; pins=[];\n    (list||[]).forEach(s=>{\n      const [x,y]=xyP(s[1],s[2]);\n      const stay=s[3]==='stay', col=stay?'#71BDB6':'#E3A65A', side=s[4]||null;\n      const halo=mk('circle',{cx:x,cy:y,fill:col,'fill-opacity':stay?.18:.15,r:1});\n      const dot=stay?mk('path',{fill:col,stroke:'#0B1119','stroke-linejoin':'round'})\n                    :mk('circle',{cx:x,cy:y,fill:col,stroke:'#0B1119',r:1});\n      const t=mk('text',{x,y,fill:stay?'#B7E0DB':'#F2F6FA','font-family':\"'IBM Plex Sans KR',sans-serif\",\n        'font-weight':'500','paint-order':'stroke',stroke:'#0B1119','stroke-linejoin':'round'});\n      t.textContent=s[0];\n      gPins.append(halo,dot,t); pins.push({halo,dot,t,x,y,stay,side});\n    });\n    restyle();\n  }\n  function restyle(){\n    if(!view)return;\n    const r=box(); u=view.h/(r.height||1);              // user units per CSS px\n    const fs=narrow()?(compact()?10:11):12, pulse=reduce?1:(1+.2*Math.sin(performance.now()/640));\n    const lead=fs*1.35*u, midX=view.x+view.w*.58;\n    const placed=[];\n    pins.slice().sort((a,b)=>a.y-b.y).forEach(p=>{\n      p.halo.setAttribute('r',((p.stay?9:8)*u*pulse).toFixed(2));\n      if(p.stay){ const r=4.6*u;\n        p.dot.setAttribute('d','M '+p.x.toFixed(1)+' '+(p.y-r).toFixed(1)+' L '+(p.x+r).toFixed(1)+' '+p.y.toFixed(1)+\n          ' L '+p.x.toFixed(1)+' '+(p.y+r).toFixed(1)+' L '+(p.x-r).toFixed(1)+' '+p.y.toFixed(1)+' Z');\n      } else p.dot.setAttribute('r',(3.2*u).toFixed(2));\n      p.dot.setAttribute('stroke-width',(1.2*u).toFixed(2));\n      const left=p.side?p.side==='l':(p.x>midX);\n      let ly=p.y+fs*.36*u;\n      for(const q of placed){\n        if(Math.abs(q.x-p.x)<150*u && Math.abs(ly-q.ly)<lead) ly=q.ly+lead;\n      }\n      placed.push({x:p.x,ly,left});\n      p.t.setAttribute('text-anchor',left?'end':'start');\n      p.t.setAttribute('x',(p.x+(left?-9*u:9*u)).toFixed(1));\n      p.t.setAttribute('y',ly.toFixed(1));\n      p.t.setAttribute('font-size',(fs*u).toFixed(2));\n      p.t.setAttribute('stroke-width',(3*u).toFixed(2));\n    });\n    style&&style(u,fs,placed);\n  }\n  function step(){\n    if(!view)return;\n    const e=.08;\n    view.x+=(target.x-view.x)*e; view.y+=(target.y-view.y)*e;\n    view.w+=(target.w-view.w)*e; view.h+=(target.h-view.h)*e;\n    svg.setAttribute('viewBox',view.x.toFixed(1)+' '+view.y.toFixed(1)+' '+view.w.toFixed(1)+' '+view.h.toFixed(1));\n    restyle();\n  }\n  return {focus,fit,fitPts,presetScale,zoomOut,preset,setPins,step,restyle,xy:xyP,get u(){return u;}};\n}\n\n/* ============ france ============ */\nconst svgF=document.getElementById('map'); svgF.__proj=FR.proj;\nconst fLand=[],fRiv=[],fBor=[];\n{ const gl=svgF.querySelector('.gLand'),gr=svgF.querySelector('.gRiv'),gb=svgF.querySelector('.gBor');\n  FR.land.forEach(d=>{const p=mk('path',{d,fill:'#16222F',stroke:'#2B3D53','stroke-linejoin':'round'});gl.appendChild(p);fLand.push(p);});\n  (FR.depts||[]).forEach(d=>{const p=mk('path',{d,fill:'none',stroke:'#2C405A','stroke-linejoin':'round'});gr.appendChild(p);fRiv.push(p);});\n  FR.borders.forEach(d=>{const p=mk('path',{d,fill:'none',stroke:'#32475F'});gb.appendChild(p);fBor.push(p);});\n}\nconst routeLine=document.getElementById('routeLine'),routePast=document.getElementById('routePast');\nconst MF=MapView(svgF,u=>{\n  fLand.forEach(p=>p.setAttribute('stroke-width',(1*u).toFixed(2)));\n  fRiv.forEach(p=>p.setAttribute('stroke-width',(.8*u).toFixed(2)));\n  fBor.forEach(p=>{p.setAttribute('stroke-width',(.9*u).toFixed(2));p.setAttribute('stroke-dasharray',(3*u).toFixed(1)+' '+(4*u).toFixed(1));});\n  routeLine.setAttribute('stroke-width',(2.6*u).toFixed(2));\n  routePast.setAttribute('stroke-width',(1.5*u).toFixed(2));\n});\n\n/* ============ paris — no circles: quiet district names + a real walking route ============ */\nconst svgP=document.getElementById('pmap'); svgP.__proj=PA.proj;\nconst pRiv=[],dists=[];\nconst pRoute=svgP.querySelector('.pRoute'),pPast=svgP.querySelector('.pPast');\nconst pCityP=[],pArrP=[],pIdfP=[];\nlet gArr=null,gRivG=null,bareView=false;\n{ const gr=svgP.querySelector('.pRiv'),gd=svgP.querySelector('.pDist'),\n        gc=svgP.querySelector('.pCity'),ga=svgP.querySelector('.pArr'),gi=svgP.querySelector('.pIdf');\n  gArr=ga; gRivG=gr;\n  (PA.idf||[]).forEach(d=>{const p=mk('path',{d,fill:'none',stroke:'#48657F','stroke-linejoin':'round'});gi.appendChild(p);pIdfP.push(p);});\n  PA.rivers.forEach(d=>{const p=mk('path',{d,fill:'none',stroke:'#2E5872','stroke-linecap':'round','stroke-linejoin':'round'});gr.appendChild(p);pRiv.push(p);});\n  (PA.arr||[]).forEach(d=>{const p=mk('path',{d,fill:'none',stroke:'#3C5C79','stroke-opacity':.55,'stroke-linejoin':'round','stroke-linecap':'round'});ga.appendChild(p);pArrP.push(p);});\n    (PA.arrLbl||[]).forEach(a=>{\n    const t=mk('text',{x:a[1],y:a[2],'text-anchor':'middle',fill:'#6C7E93',\n      'font-family':\"'IBM Plex Mono',monospace\",'font-weight':'400',\n      'paint-order':'stroke',stroke:'#0B1119','stroke-linejoin':'round'});\n    t.textContent=a[0];\n    gd.appendChild(t); dists.push({t,x:a[1],y:a[2]});\n  });\n}\nconst MP=MapView(svgP,(u,fs,placed)=>{\n  const sw=Math.min(Math.max(1.8*u,.0011*PA.proj.s),9*u);   // 센강은 강폭처럼 확대하되 너무 굵어지지 않게\n  pRiv.forEach(p=>p.setAttribute('stroke-width',sw.toFixed(2)));\n  pArrP.forEach(p=>p.setAttribute('stroke-width',(.65*u).toFixed(2)));\n  pIdfP.forEach(p=>p.setAttribute('stroke-width',(.9*u).toFixed(2)));\n  // 넓게 볼 땐 파리 테두리만 남기고 구 구획·센강은 감춘다\n  const wide=bareView||(u*(svgP.getBoundingClientRect().height||1))/PA.proj.s>.30;\n  if(gArr)gArr.style.opacity=wide?0:1;\n  if(gRivG)gRivG.style.opacity=wide?0:1;\n  pRoute.setAttribute('stroke-width',(2.6*u).toFixed(2));\n  pPast.setAttribute('stroke-width',(1.5*u).toFixed(2));\n  dists.forEach(d=>{                       // 구 번호는 제 구역 안에 고정\n    d.t.setAttribute('font-size',((fs-1.5)*u).toFixed(2));\n    d.t.setAttribute('stroke-width',(2.6*u).toFixed(2));\n    d.t.setAttribute('y',(d.y+(fs-1.5)*.36*u).toFixed(1));\n    d.t.style.opacity = wide?0:.55;\n  });\n});\nfunction setDistricts(){}\nconst parisPath=m=>'M '+m.map(q=>{const p=MP.xy(q[1],q[2]);return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L ');\nfunction setParisRoute(marks,idx){\n  pPast.setAttribute('d', bareView ? '' :\n    DAYS.slice(0,idx).filter(d=>d.city==='paris'&&!d.bare&&d.marks&&d.marks.length>1)\n      .map(d=>parisPath(d.marks)).join(' '));\n  if(!marks||marks.length<2){pRoute.setAttribute('d','');return;}\n  pRoute.setAttribute('d',parisPath(marks));\n  drawSeg(pRoute,0,pRoute.getTotalLength(),1100);\n}\n\n/* ============ world (인천 ↔ 파리) ============ */\nconst svgW=document.getElementById('wmap'); svgW.__proj=WD.proj;\nconst wLandP=[],wArc=svgW.querySelector('.wArc');\n{ const g=svgW.querySelector('.wLand');\n  WD.land.forEach(d=>{const p=mk('path',{d,fill:'#15202C',stroke:'#27384C','stroke-linejoin':'round'});g.appendChild(p);wLandP.push(p);});\n}\nconst MW=MapView(svgW,u=>{\n  wLandP.forEach(p=>p.setAttribute('stroke-width',(1*u).toFixed(2)));\n  wArc.setAttribute('stroke-width',(2.6*u).toFixed(2));\n});\nconst ARC_BB=(()=>{let a=90,b=-90,c=180,d=-180;\n  WD.arc.forEach(p=>{a=Math.min(a,p[0]);b=Math.max(b,p[0]);c=Math.min(c,p[1]);d=Math.max(d,p[1]);});\n  return [a,b,c,d];})();\nfunction setWorld(dir){\n  const pts=dir<0?WD.arc.slice().reverse():WD.arc;\n  wArc.setAttribute('d','M '+pts.map(p=>{const q=MW.xy(p[0],p[1]);return q[0].toFixed(1)+' '+q[1].toFixed(1);}).join(' L '));\n  MW.setPins(dir<0?[['파리',WD.cdg[0],WD.cdg[1]],['인천',WD.icn[0],WD.icn[1]]]\n                 :[['인천',WD.icn[0],WD.icn[1]],['파리',WD.cdg[0],WD.cdg[1]]]);\n  drawSeg(wArc,0,wArc.getTotalLength(),1800);\n}\n\n/* ============ france route ============ */\nconst pts=[],dayEnd=[],dayStart=[];\nDAYS.forEach(day=>{\n  let first=-1;\n  day.stops.forEach(s=>{\n    const p=MF.xy(s[1],s[2]),last=pts[pts.length-1];\n    if(!last||Math.abs(last[0]-p[0])>.5||Math.abs(last[1]-p[1])>.5)pts.push(p);\n    if(first<0)first=pts.length-1;\n  });\n  dayStart.push(first<0?pts.length-1:first); dayEnd.push(pts.length-1);\n});\nconst RD='M '+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');\nrouteLine.setAttribute('d',RD); routePast.setAttribute('d',RD);\nconst TOTAL=routeLine.getTotalLength(),cum=[0];\nfor(let i=1;i<pts.length;i++)cum[i]=cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);\nconst kS=cum[cum.length-1]?TOTAL/cum[cum.length-1]:1;\nroutePast.style.strokeDasharray=TOTAL+' '+TOTAL;\nroutePast.style.strokeDashoffset=TOTAL;\nif(!reduce)routePast.style.transition='stroke-dashoffset .9s cubic-bezier(.3,.7,.3,1)';\nfunction franceLeg(i){\n  const a=cum[dayStart[i]]*kS, b=cum[dayEnd[i]]*kS, len=Math.max(0,b-a);\n  routePast.style.strokeDashoffset=Math.max(0,TOTAL-b);\n  drawSeg(routeLine,a,len,len<.5?0:1000);\n}\n\n/* ============ sections ============ */\nconst host=document.getElementById('days');\nDAYS.forEach(day=>{\n  const sec=document.createElement('section'); sec.className='day';\n  const cl=day.chips||day.stops.map(s=>s[0]);\n  const chips=cl.map(n=>'<span class=\"stop\">'+n+'<\/span>').join('<span class=\"arw\">→<\/span>');\n  const beats=day.beats.map(b=>'<li class=\"'+(b.hi?'hi':'')+'\">'+b.t+'<\/li>').join('');\n  const bk=day.bk&&day.bk.length?'<div class=\"bk\"><div class=\"bk-h\">예약 · 식당<\/div>'+\n    day.bk.map(r=>'<div class=\"bk-r\"><div class=\"bk-k\">'+r[0]+'<\/div><div class=\"bk-v\">'+r[1]+'<\/div><\/div>').join('')+'<\/div>':'';\n  const dm=day.date.match(/(\\d+)월\\s*(\\d+)일\\s*\\((.)\\)/)||[],\n        wd=(dm[3]||'')+'요일';\n  sec.innerHTML='<div class=\"dhead\"><div class=\"dnum\"><span class=\"mo\">'+(dm[1]||'')+'월<\/span>'+\n    '<span class=\"dd\">'+(dm[2]||'')+'<\/span><\/div>'+\n    '<div class=\"dmeta\"><div class=\"ddate\">'+wd+' · '+day.d+'일차<\/div><h2>'+day.title+\n    (day.star?'<span class=\"star\">●<\/span>':'')+'<\/h2><\/div><\/div>'+\n    '<div class=\"route\">'+chips+'<\/div><ul class=\"beats\">'+beats+'<\/ul>'+bk;\n  host.appendChild(sec);\n});\nconst secs=[...document.querySelectorAll('.day')];\nconst heroEl=document.querySelector('.hero'), endEl=document.querySelector('.end');\nconst STAGES=[{world:1,dir:1,region:'인천 → 파리',note:'11월 15일 (일) · 출발',el:heroEl}]\n  .concat(DAYS.map((d,i)=>({day:i,el:secs[i]})))\n  .concat([{world:1,dir:-1,region:'파리 → 인천',note:'11월 28일 (토) · 도착',el:endEl}]);\n\n/* ============ activation ============ */\nlet cur=-1,wasParis=false;\nconst mRegion=document.getElementById('mRegion'),mNote=document.getElementById('mNote'),\n      wrapF=document.getElementById('mapwrapF'),wrapP=document.getElementById('mapwrapP'),\n      wrapW=document.getElementById('mapwrapW'),mLegend=document.getElementById('mLegend');\nconst PARIS_GATE=[48.8575,2.3400,.30];\nfunction activate(si){\n  if(si===cur)return;\n  const prev=cur>=0?STAGES[cur]:null; cur=si;\n  const st=STAGES[si];\n  secs.forEach((s,j)=>s.classList.toggle('act',st.day===j));\n  if(st.world){\n    // 떠나는 지도는 계속 빠지면서 사라지고, 세계지도는 도시에 바짝 붙었다가 확 빠진다\n    if(prev&&!prev.world){ const pd=DAYS[prev.day]; (pd.city==='paris'?MP:MF).zoomOut(4.5); }\n    MW.preset(st.dir<0?WD.cdg[0]:WD.icn[0], st.dir<0?WD.cdg[1]:WD.icn[1], 1.6);\n    MW.fit(ARC_BB);\n    setWorld(st.dir);\n    wrapP.classList.remove('show'); wrapW.classList.add('show');\n    wrapF.classList.add('dim'); mLegend.classList.remove('on');\n    mRegion.textContent=st.region; mNote.textContent=st.note;\n    return;\n  }\n  const i=st.day, day=DAYS[i], isP=day.city==='paris';\n  const V=isP?MP:MF, pl=(isP?day.marks:day.stops).map(p=>[p[1],p[2]]);\n  V.fitPts(pl, isP?.045:.32);                 // 그날 들르는 곳이 모두 화면에 들어오게\n  if(prev&&prev.world){\n    MW.focus(48.8566,2.3522,2.2);             // 세계지도는 파리로 계속 파고들며 사라지고\n    V.presetScale(4.2);                       // 들어오는 지도는 넓은 데서 좁혀 들어온다\n  }\n  bareView=!!(isP&&day.bare);\n  if(isP){ MF.focus(PARIS_GATE[0],PARIS_GATE[1],PARIS_GATE[2]);\n    if(!wasParis&&!(prev&&prev.world)) MP.presetScale(2.1);\n    MP.setPins(day.marks); setDistricts(day.zones); setParisRoute(day.marks,i); }\n  else { MF.setPins(day.stops); franceLeg(i); }\n  wrapP.classList.toggle('show',isP);\n  wrapW.classList.remove('show');\n  mLegend.classList.toggle('on',isP);\n  wrapF.classList.toggle('dim',isP);\n  wasParis=isP;\n  mRegion.textContent=day.region;\n  mNote.textContent=day.date+' · '+day.d+'일차';\n}\nfunction frame(){MF.step();MP.step();MW.step();requestAnimationFrame(frame);}\nactivate(0); requestAnimationFrame(frame);\n\nconst io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('rv');});},\n  {rootMargin:'0px 0px -12% 0px',threshold:.08});\nsecs.forEach(s=>io.observe(s));\n\n/* ============ rail ============ */\nconst railFill=document.getElementById('railFill'),head=document.getElementById('headSvg');\nconst mapwrapEl=document.getElementById('mapwrap'), railEl=document.getElementById('rail');\nfunction onScroll(){\n  const vh=innerHeight, mid=narrow()?mapwrapEl.getBoundingClientRect().height+vh*.04:vh*.21;\n  let best=0,bd=1e9;\n  STAGES.forEach((s,i)=>{const r=s.el.getBoundingClientRect();\n    const d=Math.abs(r.top-mid); if(r.top<vh*.8&&d<bd){bd=d;best=i;}});\n  if(scrollY+vh>=document.documentElement.scrollHeight-4) best=STAGES.length-1;\n  activate(best);\n  const p=Math.min(1,Math.max(0,scrollY/((document.documentElement.scrollHeight-vh)||1)));\n  railFill.setAttribute('y2',(p*100).toFixed(2));\n  const railTop=narrow()?Math.max(0,railEl.getBoundingClientRect().top):0;\n  head.style.transform='translateY('+(p*(vh-railTop-26)).toFixed(1)+'px)';\n}\naddEventListener('scroll',onScroll,{passive:true});\nfunction refit(){const st=STAGES[Math.max(0,cur)]||STAGES[0];\n  if(st.world)MW.fit(ARC_BB);\n  else {const d=DAYS[st.day],isP=d.city==='paris';\n    (isP?MP:MF).fitPts((isP?d.marks:d.stops).map(p=>[p[1],p[2]]), isP?.045:.32);}\n  MF.restyle();MP.restyle();MW.restyle();onScroll();}\naddEventListener('resize',refit);\n\n/* ============ 지도 높이 접기 ============ */\nconst mapTg=document.getElementById('mapTg'), MH_KEY='fr13.mapsm';\nfunction setMapSm(on,save){\n  const wasNarrow=narrow(), vh=innerHeight;\n  const before=document.body.classList.contains('mapsm');\n  if(before===on)return;\n  document.body.classList.toggle('mapsm',on);\n  mapTg.setAttribute('aria-pressed',on?'true':'false');\n  // 모바일: 본문 margin이 즉시 줄어드는 만큼 스크롤을 보정해 지금 읽던 자리가 그대로 보이게\n  if(wasNarrow){ const d=(.42-.22)*vh*(on?1:-1); if(scrollY>0) scrollBy(0,-d); }\n  if(save){ try{localStorage.setItem(MH_KEY,on?'1':'0');}catch(e){} }\n  onScroll(); setTimeout(refit,400);\n}\nmapTg.addEventListener('click',()=>setMapSm(!document.body.classList.contains('mapsm'),true));\ntry{ if(localStorage.getItem(MH_KEY)==='1'){ document.body.classList.add('mapsm'); mapTg.setAttribute('aria-pressed','true'); refit(); } }catch(e){}\nonScroll();\nwindow.f13Go=function(d){var el=secs[(+d||1)-1]; if(!el)return; el.scrollIntoView({block:'start'}); setTimeout(onScroll,60);};\n\n<\/script>\n<\/body><\/html>";
</script>

      var _c=mergeCost(this.data.cost); this.data.cost=_c.cost; if(_c.added)LS.set('hm2026-cost',this.data.cost);
      this.data.book=normBook(LS.get('hm2026-book',null)||(typeof PB!=='undefined'?JSON.parse(JSON.stringify(PB)):[]));
      var _m=this.mergeSeed(this.data.book); this.data.book=_m.book; if(_m.added)LS.set('hm2026-book',this.data.book);
      this.fx=LS.get('hm2026-fx',null)||FX_FALLBACK;
      var _p=mergePrep(LS.get('hm2026-prep',null)||[]); this.data.prep=_p.prep;
      if(_p.added||LS.get('hm2026-prepver',0)<PREP_VER){ LS.set('hm2026-prep',this.data.prep); LS.set('hm2026-prepver',PREP_VER); } },
    mergeSeed:function(book){
      var added=false;
      if(typeof PB_DROP!=='undefined'){ for(var di=book.length-1;di>=0;di--){ if(PB_DROP.indexOf((book[di].t||'').trim())>=0){ book.splice(di,1); added=true; } } }
      for(var hi=book.length-1;hi>=0;hi--){ if(book[hi].cat==='숙소'){ book.splice(hi,1); added=true; } }
      var have={}; book.forEach(function(p){ have[(p.t||'').trim()]=1; });
      var SEEDS=(typeof PB!=='undefined'?PB:[]).concat(typeof PB_REST!=='undefined'?PB_REST:[]);
      SEEDS.forEach(function(p){ if(p.cat==='숙소')return; if(!have[(p.t||'').trim()]){ book.push(JSON.parse(JSON.stringify(p))); have[(p.t||'').trim()]=1; added=true; } });
      book=normBook(book);
      if(typeof PB_INFO!=='undefined'){ book.forEach(function(p){ var d=PB_INFO[(p.t||'').trim()]; if(d){ ['web','addr','tel'].forEach(function(k){ if(!p[k]&&d[k]){ p[k]=d[k]; added=true; } }); } }); }
      if(typeof PB_FIX!=='undefined'){ book.forEach(function(p){ var f=PB_FIX[(p.t||'').trim()]; if(f){ for(var k in f){ if(JSON.stringify(p[k])!==JSON.stringify(f[k])){ p[k]=JSON.parse(JSON.stringify(f[k])); added=true; } } } }); }
      var RF={}; if(typeof PB_REST!=='undefined'){ PB_REST.forEach(function(p){ var f={}; RKEYS.forEach(function(k){ if(p[k]!==undefined)f[k]=p[k]; }); RF[p.t.trim()]=f; }); }
      if(typeof PB_RFIX!=='undefined'){ for(var rk in PB_RFIX)RF[rk]=PB_RFIX[rk]; }
      book.forEach(function(p){ var f=RF[(p.t||'').trim()]; if(f){ if(p.cat!=='식당'){ p.cat='식당'; added=true; } for(var k in f){ if(JSON.stringify(p[k])!==JSON.stringify(f[k])){ p[k]=JSON.parse(JSON.stringify(f[k])); added=true; } } } });
      return {book:book, added:added}; },
    save:function(){ LS.set('hm2026-sched',this.data.sched); LS.set('hm2026-cost',this.data.cost); LS.set('hm2026-book',this.data.book); LS.set('hm2026-prep',this.data.prep);
      var warn=function(){ syncMsg('⚠ 동기화 권한 없음 — Firebase 규칙 확인 필요','#b5424e'); };
      if(FB){ try{
        this._ls=JSON.stringify(this.data.sched); fbSched.set(this._ls).catch(warn);
        this._lc=JSON.stringify(this.data.cost);  fbCost.set(this._lc).catch(warn);
        this._lb=JSON.stringify(this.data.book);  fbBook.set(this._lb).catch(warn);
        this._lp=JSON.stringify(this.data.prep);  fbPrep.set(this._lp).catch(warn);
      }catch(e){} } },
    isEditing:function(){ var a=document.activeElement; var host=document.getElementById('modeHoneymoon');
      return a && host && host.contains(a) && (a.isContentEditable||a.tagName==='INPUT'||a.tagName==='SELECT'); },
    applyRemote:function(){ if(this.isEditing()){ this._pend=true; return; }
      if(this.cur==='sched')this.renderSched(); else if(this.cur==='cost')this.renderCost(); else if(this.cur==='book')this.renderBook(); else if(this.cur==='prep')this.renderPrep(); },
    connectFB:function(){ var self=this;
      if(!FB){ syncMsg('이 기기에만 저장 (동기화 꺼짐 — PIN 입력 후 새로고침)'); return; }
      var onErr=function(){ syncMsg('⚠ 동기화 권한 없음 — Firebase 규칙 확인 필요','#b5424e'); };
      fbSched.on('value',function(snap){ var v=snap.val();
        if(v==null){ self._ls=JSON.stringify(self.data.sched); fbSched.set(self._ls).catch(onErr); return; }
        if(v===self._ls){ self._schedReset=false; return; }
        if(self._schedReset){ self._ls=JSON.stringify(self.data.sched); fbSched.set(self._ls).catch(onErr); self._schedReset=false; return; }
        try{ var p=JSON.parse(v); if(Array.isArray(p)){ self.data.sched=normSched(p); LS.set('hm2026-sched',self.data.sched); self.applyRemote(); } }catch(e){} }, onErr);
      fbCost.on('value',function(snap){ var v=snap.val();
        if(v==null){ self._lc=JSON.stringify(self.data.cost); fbCost.set(self._lc).catch(onErr); return; }
        if(v===self._lc)return; try{ var p=JSON.parse(v); if(Array.isArray(p)){ var mc=mergeCost(p); self.data.cost=mc.cost; LS.set('hm2026-cost',self.data.cost); if(mc.added){ self._lc=JSON.stringify(self.data.cost); fbCost.set(self._lc).catch(onErr); } self.applyRemote(); } }catch(e){} }, onErr);
      fbBook.on('value',function(snap){ var v=snap.val();
        if(v==null){ self._lb=JSON.stringify(self.data.book); fbBook.set(self._lb).catch(onErr); return; }
        if(v===self._lb)return; try{ var p=JSON.parse(v); if(Array.isArray(p)){ var m=self.mergeSeed(normBook(p)); self.data.book=m.book; LS.set('hm2026-book',self.data.book); if(m.added){ self._lb=JSON.stringify(self.data.book); fbBook.set(self._lb).catch(onErr); } self.applyRemote(); } }catch(e){} }, onErr);
      fbPrep.on('value',function(snap){ var v=snap.val();
        if(v==null){ self._lp=JSON.stringify(self.data.prep); fbPrep.set(self._lp).catch(onErr); return; }
        if(v===self._lp)return; try{ var p=JSON.parse(v); if(Array.isArray(p)){ var mp=mergePrep(p); self.data.prep=mp.prep; LS.set('hm2026-prep',self.data.prep); if(mp.added){ self._lp=JSON.stringify(self.data.prep); fbPrep.set(self._lp).catch(onErr); } self.applyRemote(); } }catch(e){} }, onErr);
      document.getElementById('modeHoneymoon').addEventListener('focusout',function(){
        setTimeout(function(){ if(self._pend && !self.isEditing()){ self._pend=false; self.applyRemote(); } },160); });
      syncMsg('● 실시간 동기화 켜짐 (양쪽 기기 공유)','#4a7c59'); },
    tab:function(t){ this.cur=t; this._schedEd=false; var s=document.getElementById('modeHoneymoon');
      s.querySelectorAll('.hm-subtabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.ht===t); });
      s.querySelectorAll('.hm-sec').forEach(function(x){ x.classList.remove('on'); });
      document.getElementById('ht-'+t).classList.add('on');

              '<div class="bk-o">'+esc(p.one||(typeof PB_ONE!=='undefined'&&PB_ONE[(p.t||'').trim()])||p.lead||'')+'</div></div>'; });

        '<div class="bk-cnt">'+n+'곳'+(self.tfilt==='식당'?' · 구글 평점순 · 흐린 줄은 지금 못 가는 곳':'')+'</div>'+rows+'</div></div>';
      var off=this.stickOff(), rl0=document.getElementById('bk-rail'); if(rl0){ rl0.style.top=(off+8)+'px'; rl0.style.maxHeight='calc(100vh - '+(off+16)+'px)'; }
      var on=el.querySelector('.bk-rail .on'); if(on&&on.scrollIntoView){ try{ var rl=document.getElementById('bk-rail'); var r1=on.getBoundingClientRect(), r2=rl.getBoundingClientRect(); if(r1.top<r2.top||r1.bottom>r2.bottom)rl.scrollTop+=r1.top-r2.top-40; }catch(e){} } },
    stickOff:function(){ var nav=document.querySelector('#modeHoneymoon .hm-subtabs'); if(!nav)return 0; var cs=getComputedStyle(nav); if(cs.position!=='sticky'&&cs.position!=='-webkit-sticky')return 0; return nav.offsetHeight+(parseFloat(cs.top)||0); },
    bookTop:function(){ var el=document.getElementById('ht-book'); if(!el)return; var y=el.getBoundingClientRect().top+(window.pageYOffset||0)-this.stickOff()-6; if((window.pageYOffset||0)>y)window.scrollTo(0,y); },
    setTypeFilt:function(t){ this.tfilt=t; if(t!=='식당')this.sfilt='all'; this.renderBook(); this.bookTop(); },
    setSubFilt:function(t){ this.sfilt=t; this.renderBook(); this.bookTop(); },
    setFilt:function(f){ this.filt=(this.filt===f?'all':f); this.renderBook(); this.bookTop(); },
    setZone:function(z){ this.zfilt=z; this.filt='all'; this.renderBook(); this.bookTop(); },
    miniMap:function(p){
      if(typeof HM_GEO==='undefined')return '';
      var g=HM_GEO[geoOf(p.r)]; if(!g)return '';
      var cc=(p.lat&&p.lng)?[p.lat,p.lng]:(HM_COORDS[p.t]||null);
      if(!cc)return '';
      var pj=g.proj, W=g.W, H=g.H;
      var proj=function(lng,lat){return [pj.ox+(lng*pj.k-pj.xmin)*pj.s, pj.oy+(-lat-pj.ymin)*pj.s];};
      var lbl=function(x,y,name,side,hi){ var dx=0,dy=3.4,anc='start';
        if(side==='r'){dx=7;anc='start';}else if(side==='l'){dx=-7;anc='end';}
        else if(side==='t'){dy=-8;anc='middle';}else if(side==='b'){dy=13;anc='middle';}
        return '<text x="'+(x+dx).toFixed(1)+'" y="'+(y+dy).toFixed(1)+'" text-anchor="'+anc+'" class="hm-lbl'+(hi?' hm-lbl-hi':'')+'">'+esc(name)+'</text>'; };
      var s='';
      if(g.sea){ s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#dceaf1"/>'; }
      g.paths.forEach(function(d){ s+='<path d="'+d+'" fill="#efe7d6" stroke="#b9ab92" stroke-width="1.4" stroke-linejoin="round"/>'; });
      if(g.rivers){ g.rivers.forEach(function(d){ s+='<path d="'+d+'" fill="none" stroke="#b6cedd" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>'; }); }
      // faint dots: other same-region places
      (this.data.book||[]).forEach(function(b){ if(b===p||geoOf(b.r)!==geoOf(p.r))return; var c=HM_COORDS[b.t]; if(!c)return;
        var xy=proj(c[1],c[0]); s+='<circle cx="'+xy[0].toFixed(1)+'" cy="'+xy[1].toFixed(1)+'" r="2.4" fill="#a89f93" stroke="#fff" stroke-width="0.8"/>'; });
      // anchor towns (labeled)
      var curAnch=false, anch=(typeof HM_ANCH!=='undefined'&&HM_ANCH[geoOf(p.r)])||[];
      anch.forEach(function(a){ var xy=proj(a[2],a[1]);
        var isCur=Math.abs(a[1]-cc[0])<0.006 && Math.abs(a[2]-cc[1])<0.006; if(isCur)curAnch=true;
        if(isCur){ s+='<circle cx="'+xy[0].toFixed(1)+'" cy="'+xy[1].toFixed(1)+'" r="11" fill="#c0405a" opacity="0.16"/><circle cx="'+xy[0].toFixed(1)+'" cy="'+xy[1].toFixed(1)+'" r="5" fill="#c0405a" stroke="#fff" stroke-width="1.6"/>'; }
        else { s+='<circle cx="'+xy[0].toFixed(1)+'" cy="'+xy[1].toFixed(1)+'" r="3" fill="#7a7266" stroke="#fff" stroke-width="1"/>'; }
        s+=lbl(xy[0],xy[1],a[0],a[3],isCur); });
      // current place (if not an anchor) -> red dot
      if(!curAnch){ var xy=proj(cc[1],cc[0]);
        s+='<circle cx="'+xy[0].toFixed(1)+'" cy="'+xy[1].toFixed(1)+'" r="11" fill="#c0405a" opacity="0.16"/><circle cx="'+xy[0].toFixed(1)+'" cy="'+xy[1].toFixed(1)+'" r="5" fill="#c0405a" stroke="#fff" stroke-width="1.6"/>'; }
      return '<div class="hm-mini"><div class="hm-mini-h">📍 위치</div><svg viewBox="0 0 '+W+' '+H+'" class="hm-mini-svg">'+s+'</svg></div>';
    },
    openCard:function(i){ var p=this.data.book[i]; if(!p)return;
      document.getElementById('hm-m-img').onerror=function(){ this.style.display='none'; };
      document.getElementById('hm-m-img').src=p.img||'';
      document.getElementById('hm-m-img').style.display=p.img?'block':'none';
      document.getElementById('hm-m-title').textContent=p.t||'';
      document.getElementById('hm-m-day').textContent=regionLabel(p.r)+' · '+(p.cat||'관광지')+(p.day?' · '+p.day:'');
      var telh=(p.tel||'').replace(/\s/g,'');
      var contact=(p.web||p.addr||p.tel)?('<div class="pinfo">'+
        (p.web?'<div>🌐 <a href="'+esc(p.web)+'" target="_blank" rel="noopener">홈페이지 열기</a></div>':'')+
        (p.addr?'<div>📍 '+esc(p.addr)+'</div>':'')+
        (p.tel?'<div>☎ <a href="tel:'+esc(telh)+'">'+esc(p.tel)+'</a></div>':'')+'</div>'):'';
      var gq=encodeURIComponent((p.t||'').replace(/\s*\(.*?\)\s*/g,' ')+' '+(p.addr||''));
      var rb='';
      if(p.cat==='식당'){
        rb+='<div class="rmeta">'+(p.g?'<div>⭐ 구글 <b>'+esc(p.g)+'</b>'+(p.gn?' ('+esc(p.gn)+'개 리뷰)':'')+(p.sub?' · '+esc(p.sub):'')+'</div>':'')+
            (p.price?'<div>💶 '+esc(p.price)+'</div>':'')+(p.hours?'<div>🕒 '+esc(p.hours)+'</div>':'')+'</div>';
        if(p.open)rb+='<div class="ropen '+(p.st||'')+'">📅 우리 일정: '+esc(p.open)+'</div>';
        if(p.menu&&p.menu.length)rb+='<h4>🍽 메뉴</h4><table class="rmenu">'+p.menu.map(function(m){return '<tr><td>'+esc(m[0])+'</td><td class="p">'+esc(m[1]||'')+'</td></tr>';}).join('')+'</table>';
        if(p.menuImg&&p.menuImg.length)rb+='<h4>📋 메뉴판 사진</h4><div class="rimgs">'+p.menuImg.map(function(u){return '<a href="'+esc(u)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(u)+'" onerror="this.parentNode.style.display=&quot;none&quot;"></a>';}).join('')+'</div>';
        rb+='<div class="rbtns"><a href="https://www.google.com/maps/search/?api=1&query='+gq+'" target="_blank" rel="noopener">📍 구글지도 · 사진·리뷰</a>'+(p.menuUrl?'<a href="'+esc(p.menuUrl)+'" target="_blank" rel="noopener">📄 공식 메뉴판</a>':'')+'</div>';
      }
      document.getElementById('hm-m-body').innerHTML='<p class="lead">'+esc(p.lead||'')+'</p>'+rb+contact+this.miniMap(p)+
        (p.hl&&p.hl.length?'<h4>💡 하이라이트</h4><ul>'+p.hl.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')+
        (p.info&&p.info.length?'<h4>ℹ️ 실용 정보</h4><ul>'+p.info.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')+
        (p.tip?'<div class="tip"><b>TIP</b> · '+esc(p.tip)+'</div>':'')+
        (p.story?'<div class="st">'+esc(p.story)+'</div>':'')+
        '<div class="bf-btns"><button class="save" onclick="HM.editBook('+i+')">✏ 수정</button>'+
        '<button class="del" onclick="HM.delBook('+i+')">🗑 삭제</button></div>';
      document.getElementById('hm-overlay').classList.add('on'); document.body.style.overflow='hidden'; },
    editBook:function(i){ var p=this.data.book[i]; if(!p)return;
      document.getElementById('hm-m-img').src=p.img||''; document.getElementById('hm-m-img').style.display=p.img?'block':'none';
      document.getElementById('hm-m-title').textContent='장소 편집'; document.getElementById('hm-m-day').textContent='';
      var reg=REGIONS.map(function(r){return '<option value="'+r[0]+'"'+(r[0]===p.r?' selected':'')+'>'+r[1]+'</option>';}).join('');
      document.getElementById('hm-m-body').innerHTML=
        '<div class="bf-l">지역</div><select id="bf-r" class="bf-in">'+reg+'</select>'+
        '<div class="bf-l">카테고리</div><select id="bf-cat" class="bf-in">'+BTYPES.map(function(c){return '<option'+(c===(p.cat||'관광지')?' selected':'')+'>'+c+'</option>';}).join('')+'</select>'+
        '<div class="bf-l">일정 메모 (예: D6 · 11/20)</div><input id="bf-day" class="bf-in" value="'+esc(p.day||'')+'">'+
        '<div class="bf-l">제목</div><input id="bf-t" class="bf-in" value="'+esc(p.t||'')+'">'+
        '<div class="bf-l">이미지 URL</div><input id="bf-img" class="bf-in" value="'+esc(p.img||'')+'" placeholder="https://...">'+
        '<div class="bf-l">홈페이지 URL</div><input id="bf-web" class="bf-in" value="'+esc(p.web||'')+'" placeholder="https://...">'+
        '<div class="bf-l">주소</div><input id="bf-addr" class="bf-in" value="'+esc(p.addr||'')+'">'+
        '<div class="bf-l">연락처</div><input id="bf-tel" class="bf-in" value="'+esc(p.tel||'')+'" placeholder="+39 ...">'+
        '<div class="bf-l">소개</div><textarea id="bf-lead" class="bf-in">'+esc(p.lead||'')+'</textarea>'+
        '<div class="bf-l">💡 하이라이트 (한 줄에 하나씩)</div><textarea id="bf-hl" class="bf-in">'+esc((p.hl||[]).join('\n'))+'</textarea>'+
        '<div class="bf-l">ℹ️ 실용 정보 (한 줄에 하나씩)</div><textarea id="bf-info" class="bf-in">'+esc((p.info||[]).join('\n'))+'</textarea>'+
        '<div class="bf-l">TIP</div><textarea id="bf-tip" class="bf-in">'+esc(p.tip||'')+'</textarea>'+
        '<div class="bf-l">이야기</div><textarea id="bf-story" class="bf-in">'+esc(p.story||'')+'</textarea>'+
        '<div class="bf-btns"><button onclick="HM.openCard('+i+')">취소</button><button class="save" onclick="HM.saveBook('+i+')">저장</button></div>';
      document.getElementById('hm-overlay').classList.add('on'); document.body.style.overflow='hidden'; },
    saveBook:function(i){ var p=this.data.book[i]; if(!p)return; var g=function(id){return document.getElementById(id).value;};
      var lines=function(id){return g(id).split('\n').map(function(s){return s.trim();}).filter(Boolean);};
      p.r=g('bf-r'); p.cat=g('bf-cat'); p.day=g('bf-day').trim(); p.t=g('bf-t').trim(); p.img=g('bf-img').trim();
      p.web=g('bf-web').trim(); p.addr=g('bf-addr').trim(); p.tel=g('bf-tel').trim();
      p.lead=g('bf-lead').trim(); p.hl=lines('bf-hl'); p.info=lines('bf-info'); p.tip=g('bf-tip').trim(); p.story=g('bf-story').trim();
      this.save(); this.renderBook(); this.openCard(i); },
    addBook:function(){ var id=Date.now(); this.data.book.push({id:id,r:(this.filt!=='all'?this.filt:(function(z){ for(var i=0;i<ZONES.length;i++)if(ZONES[i][0]===z)return ZONES[i][2][0]; return 'nice'; })(this.zfilt)),cat:(this.tfilt!=='all'?this.tfilt:'관광지'),day:'',t:'새 장소',img:'',web:'',addr:'',tel:'',lead:'',hl:[],info:[],tip:'',story:''});
      this.save(); this.editBook(this.data.book.length-1); },
    delBook:function(i){ if(confirm('이 장소를 삭제할까요?')){ this.data.book.splice(i,1); this.save(); this.closeCard(); this.renderBook(); } },
    closeCard:function(){ document.getElementById('hm-overlay').classList.remove('on'); document.body.style.overflow=''; },
    openMap:function(d){ var o=document.getElementById('hm-f13'), f=document.getElementById('hm-f13-fr');
      var go=function(){ try{ if(d&&f.contentWindow&&f.contentWindow.f13Go)f.contentWindow.f13Go(d); }catch(e){} };
      o.classList.add('on'); document.body.style.overflow='hidden';
      if(!f.getAttribute('data-ld')){ f.setAttribute('data-ld','1'); f.onload=function(){ setTimeout(go,500); };
        f.srcdoc=(typeof HM_F13!=='undefined')?HM_F13:'<p style="color:#fff;padding:24px;font-family:sans-serif">지도 데이터를 불러오지 못했어요.</p>'; }
      else { setTimeout(go,80); } },
    closeMap:function(){ document.getElementById('hm-f13').classList.remove('on'); document.body.style.overflow=''; },

    /* ── 준비 ── */
    renderPrep:function(){ var self=this; var el=document.getElementById('ht-prep'); var prep=this.data.prep;
      if(this._open==null){ this._open={}; if(prep[0])this._open[prep[0].id]=true; }
      var tot=0,done=0; prep.forEach(function(s){ s.items.forEach(function(it){ tot++; if(it.d)done++; }); });
      var pct=tot?Math.round(done/tot*100):0;
      var today=new Date(); var dep=new Date('2026-11-15T00:00:00'); var dd=Math.ceil((dep-new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
      var ddl=dd>0?'출국까지 D-'+dd:(dd===0?'출국 당일':'여행 중');
      var h='<div class="pp-prog"><div class="n">'+done+' <small>/ '+tot+'</small></div><div class="l">'+ddl+' · 챙긴 것 '+pct+'%</div><div class="pp-bar"><i style="width:'+pct+'%"></i></div></div>';
      var iso=today.toISOString().slice(0,10); var due=PREP_DUE.filter(function(x){return x.iso>=iso;}).slice(0,4);
      if(due.length){ h+='<div class="pp-due"><b>마감 있는 할 일</b>'+due.map(function(x){return '<div class="r"><span class="d">'+x.d+'</span><span>'+esc(x.t)+'</span></div>';}).join('')+'</div>'; }
      prep.forEach(function(sec,si){ var sd=0; sec.items.forEach(function(it){ if(it.d)sd++; });
        h+='<div class="pp-sec'+(self._open[sec.id]?' open':'')+'"><div class="pp-sh">'+
           '<span class="t" contenteditable onblur="HM.prepEditSec('+si+',this)">'+esc(sec.t)+'</span>'+
           '<span class="c">'+sd+'/'+sec.items.length+'</span>'+
           '<button class="hm-x" onclick="HM.prepDelSec('+si+')" title="섹션 삭제">✕</button>'+
           '<span class="v" onclick="HM.prepToggle('+sec.id+')">▼</span></div><div class="pp-body">';
        sec.items.forEach(function(it,ii){
          h+='<div class="pp-it'+(it.d?' done':'')+'"><span class="pp-cb" onclick="HM.prepCheck('+si+','+ii+')">'+(it.d?'✓':'')+'</span>'+
             '<span class="pp-tx"><span contenteditable onblur="HM.prepEdit('+si+','+ii+',\'t\',this)">'+esc(it.t)+'</span>'+
             '<span class="pp-mm" contenteditable onblur="HM.prepEdit('+si+','+ii+',\'m\',this)">'+esc(it.m||'')+'</span></span>'+
             '<button class="hm-x" onclick="HM.prepDel('+si+','+ii+')">✕</button></div>'; });
        h+='<button class="hm-add pp-add" onclick="HM.prepAdd('+si+')">＋ 항목 추가</button></div></div>'; });
      h+='<div class="pp-foot"><button class="hm-add" onclick="HM.prepAddSec()">＋ 섹션 추가</button></div>';
      el.innerHTML=h; },
    prepToggle:function(id){ this._open[id]=!this._open[id]; this.renderPrep(); },
    prepCheck:function(si,ii){ var it=this.data.prep[si].items[ii]; it.d=!it.d; this.save(); this.renderPrep(); },
    prepEdit:function(si,ii,k,e){ var v=e.textContent.trim(); if(this.data.prep[si].items[ii][k]===v)return; this.data.prep[si].items[ii][k]=v; this.save(); },
    prepEditSec:function(si,e){ var v=e.textContent.trim(); if(!v||this.data.prep[si].t===v)return; this.data.prep[si].t=v; this.save(); },
    prepAdd:function(si){ var sec=this.data.prep[si]; sec.items.push({id:Date.now(),t:'새 항목',m:'',d:false}); this._open[sec.id]=true; this.save(); this.renderPrep();
      var el=document.getElementById('ht-prep'); var secs=el.querySelectorAll('.pp-sec'); var last=secs[si]&&secs[si].querySelectorAll('.pp-it .pp-tx > span:first-child')[sec.items.length-1]; if(last){ last.focus(); try{ document.execCommand('selectAll',false,null); }catch(e){} } },
    prepDel:function(si,ii){ this.data.prep[si].items.splice(ii,1); this.save(); this.renderPrep(); },
    prepAddSec:function(){ var id=Date.now(); this.data.prep.push({id:id,t:'새 섹션',items:[]}); this._open[id]=true; this.save(); this.renderPrep(); },
    prepDelSec:function(si){ var sec=this.data.prep[si]; if(!confirm("'"+sec.t+"' 섹션과 항목 "+sec.items.length+"개를 삭제할까요?"))return; this.data.prep.splice(si,1); this.save(); this.renderPrep(); },

    init:function(){ this.load(); this.renderSched(); this.fetchFX(); this.connectFB(); }
  };
  window.HM=HM;
  if(document.readyState!=='loading')HM.init(); else document.addEventListener('DOMContentLoaded',function(){HM.init();});
})();
</script>


<script id="mode-switch-js">

  window.__setMode=setMode;
  window.__hardReload=function(){ location.replace(location.pathname + '?v=' + Date.now()); };
  window.__BUILD='2026.11.11.0100';
})();
